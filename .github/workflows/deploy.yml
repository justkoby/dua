name: Deploy React App to Hostinger FTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Build & Deploy to Hostinger
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: dua-app/package-lock.json

      - name: Install & Build
        run: |
          cd dua-app
          npm ci
          npm run build

      - name: Deploy via SFTP/FTP to Hostinger
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local_path: './dua-app/dist/*'
          remote_path: '/public_html/'
          sftp_only: false
